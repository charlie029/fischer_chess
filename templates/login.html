<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fischer Chess — Login</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
  .login-box { background: #16213e; border-radius: 12px; padding: 40px; width: 320px; text-align: center; }
  .login-box h1 { color: #e94560; font-size: 1.6em; margin-bottom: 8px; }
  .login-box p { color: #888; font-size: .9em; margin-bottom: 24px; }
  .login-box input[type="password"] { width: 100%; padding: 10px 14px; border-radius: 6px; border: 1px solid #333; background: #0d1117; color: #e0e0e0; font-size: 15px; margin-bottom: 16px; }
  .login-box input[type="password"]:focus { outline: none; border-color: #e94560; }
  .login-box button { width: 100%; padding: 10px; border-radius: 6px; border: none; background: #e94560; color: #fff; font-size: 15px; font-weight: bold; cursor: pointer; }
  .login-box button:hover { background: #c73850; }
  .error { color: #e94560; font-size: .9em; margin-bottom: 12px; }
</style>
</head>
<body>
<form class="login-box" method="POST" action="/login">
  <h1>♟ Fischer Chess</h1>
  <p>Enter password to continue</p>
  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}
  <input type="password" name="password" placeholder="Password" autofocus>
  <button type="submit">Enter</button>
</form>
</body>
</html>
